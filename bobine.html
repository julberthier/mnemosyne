<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>.</title>
<style>
  html,body{height:100%;margin:0;background:#050403;overflow-x:hidden}
  body{font-family:Consolas,'Courier New',monospace;color:#d4af37}
  .scan{position:fixed;inset:0;pointer-events:none;z-index:9;
    background:repeating-linear-gradient(0deg,rgba(0,0,0,.22) 0 1px,transparent 1px 3px)}
  .vig{position:fixed;inset:0;pointer-events:none;z-index:8;
    background:radial-gradient(ellipse at 50% 42%,transparent 55%,rgba(0,0,0,.8) 100%)}
  #wrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center;padding:2vh 8vw;text-align:center}
  .brand{letter-spacing:.5em;font-size:14px;color:#d4af37;opacity:.85;font-variant:small-caps}
  .rule{width:44px;height:1px;background:rgba(212,175,55,.4);margin:1.4vh auto}
  .lore{font-size:11.5px;color:#8a7332;letter-spacing:.16em;line-height:2.1}
  #gate{margin-top:4vh;display:flex;gap:8px;align-items:center;justify-content:center}
  #code{width:9ch;background:rgba(212,175,55,.06);border:1px solid rgba(212,175,55,.5);
    color:#f0d78c;font-family:inherit;font-size:22px;letter-spacing:.4em;text-align:center;
    padding:8px 10px;outline:none;text-indent:.4em}
  #gate button{background:none;border:1px solid rgba(212,175,55,.5);color:#d4af37;
    font-family:inherit;font-size:12px;letter-spacing:.22em;padding:10px 16px;cursor:pointer}
  #gate button:hover{background:rgba(212,175,55,.12)}
  #msg{margin-top:2.2vh;font-size:13px;letter-spacing:.2em;color:#8a7332;min-height:1.6em}
  #player{display:none;margin-top:2.6vh;width:100%;max-width:940px}
  #tuner{display:flex;align-items:center;justify-content:center;gap:18px;margin-bottom:1.2vh}
  #tuner button{background:none;border:1px solid rgba(212,175,55,.5);color:#d4af37;
    font-family:inherit;font-size:20px;padding:6px 16px;cursor:pointer}
  #tuner button:hover{background:rgba(212,175,55,.12)}
  #freq{font-size:30px;color:#f0d78c;letter-spacing:.1em;min-width:5.4ch;
    text-shadow:0 0 12px rgba(212,175,55,.4)}
  #freq small{font-size:14px;color:#8a7332}
  #needle{width:92px;height:56px}
  #dial{width:min(70vw,640px);margin:1vh auto 0;accent-color:#d4af37}
  #play{margin-top:1.6vh;background:rgba(212,175,55,.1);border:1px solid rgba(212,175,55,.6);
    color:#f0d78c;font-family:inherit;font-size:14px;letter-spacing:.24em;padding:12px 26px;cursor:pointer}
  #play:hover{background:rgba(212,175,55,.2)}
  #spec{display:block;margin-top:2.4vh;width:860px;max-width:94vw;height:230px;
    border:1px solid rgba(212,175,55,.3);background:#080604}
</style>
</head>
<body>
<div class="scan"></div><div class="vig"></div>
<div id="wrap">
  <div class="brand">La Bobine</div>
  <div class="rule"></div>
  <div class="lore" id="lore1">LA MACHINE RÉCLAME SON REGISTRE.<br>TROIS RELEVÉS, DANS L'ORDRE.</div>
  <div id="gate">
    <input id="code" maxlength="3" autocomplete="off" inputmode="numeric" spellcheck="false">
    <button id="try">SCELLER</button>
  </div>
  <div id="msg"></div>
  <div id="player">
    <div class="lore">CENT POSTES. UNE SEULE CHANTE.<br>L'AIGUILLE MONTRE LE CHANT. LE RESTE N'EST QUE STATIQUE.</div>
    <div id="tuner">
      <svg id="needle" viewBox="0 0 92 56">
        <path d="M8 50 A40 40 0 0 1 84 50" fill="none" stroke="rgba(212,175,55,.35)" stroke-width="1.4"/>
        <line id="ndg" x1="46" y1="50" x2="46" y2="14" stroke="#f0d78c" stroke-width="2.2" stroke-linecap="round"/>
        <circle cx="46" cy="50" r="3.4" fill="#d4af37"/>
      </svg>
      <button id="minus">−</button>
      <div id="freq">500<small> Hz</small></div>
      <button id="plus">+</button>
    </div>
    <input id="dial" type="range" min="0" max="99" value="0" step="1">
    <button id="play">ÉCOUTER LE POSTE</button>
    <canvas id="spec" width="860" height="230"></canvas>
  </div>
</div>
<script>
var K=0x5A;
function D(h){var s="";for(var i=0;i<h.length;i+=4){s+=String.fromCharCode(parseInt(h.substr(i,4),16)^K);}return s;}
var GRID=D("006a006b006b006b006b006b006a006a006b006b006b006b006b006a006b006a006a006a006a006a006b006b006a006a006a006a006a006b006b006a006a006a006a006a006b006b006a006a006a006a006a006b006b006a006a006a006a006a006b006b006a006a006a006a006a006b006a006b006b006b006b006b006a006a006b006b006b006b006b006a006a006a006a006a006a006a006a006a006a006a006a006a006a006a006b006b006b006b006b006b006b006b006b006b006b006b006b006b006a006b006a006a006a006a006a006a006b006a006a006a006a006a006a006a006b006a006a006a006a006a006a006b006a006a006a006a006a006a006a006b006a006a006a006a006a006a006b006a006a006a006b006b006b006b006b006b006b006b006b006b006b006b006b006b006a006a006a006a006a006a006a006a006a006a006a006a006a006a006b006b006b006b006b006b006b006b006b006b006b006b006b006b006b006a006a006a006a006a006b006b006a006a006a006a006a006b006b006a006a006a006a006a006b006b006a006a006a006a006a006b006b006a006a006a006a006a006b006b006a006a006a006a006a006b006a006b006b006b006b006b006a006a006b006b006b006b006b006a006a006a006a006a006a006a006a006a006a006a006a006a006a006a006b006b006b006b006b006b006b006b006b006b006b006b006b006b006b006a006a006b006a006a006b006b006a006a006b006a006a006b006b006a006a006b006a006a006b006b006a006a006b006a006a006b006b006a006a006b006a006a006b006b006a006a006b006a006a006b006b006a006a006a006a006a006b006b006a006a006a006a006a006b006a006a006a006a006a006a006a006a006a006a006a006a006a006a");
var REG=D("006b006b006e00760068006a006d00760069006b0062").split(",");
var P={"n_col": 48, "col_ms": 90, "f_base": 1000.0, "f_step": 200.0, "thick": 2, "lead": 1.2, "drone_f": 110.0, "drone_a": 0.04, "tone_a": 0.22, "f_min": 500, "f_step_dial": 50, "f_n": 100};
var msg=document.getElementById("msg"),gate=document.getElementById("gate"),
    player=document.getElementById("player"),code=document.getElementById("code");
document.getElementById("try").addEventListener("click",trySeal);
code.addEventListener("keydown",function(e){if(e.key==="Enter")trySeal();});
var ri=0, rstep=0;
var REF=["CE RELEVÉ N'EST PAS DU REGISTRE.","LE REGISTRE N'A PAS CETTE PAGE.","LE CONSORTIUM ATTEND."];
function trySeal(){
  if(code.value.trim()===REG[rstep]){
    rstep++;
    if(rstep<REG.length){
      msg.textContent=rstep===1?"LE REGISTRE CONTINUE.":"LE REGISTRE SE TERMINE.";
      code.value="";
    }else{
      gate.style.display="none";player.style.display="block";
      document.getElementById("lore1").style.display="none";
      msg.textContent="LE REGISTRE EST COMPLET. LA BOBINE EST LIBRE.";
    }
  }else{
    msg.textContent=REF[ri++%REF.length];code.value="";
  }
}

/* ---- le poste : 100 fréquences, une seule porte le mot ---- */
var FI=0;                                    /* index 0..99 */
var F0=function(){return P.f_min+FI*P.f_step_dial;};
var FSTAR=P.f_base+7*P.f_step;               /* centre de la bande du mot (calculé) */
var CORRECT=function(){return Math.abs(F0()-FSTAR)<1;};
var freqEl=document.getElementById("freq"),dial=document.getElementById("dial"),
    ndg=document.getElementById("ndg");
function jit(fi){                             /* scintillement stable par poste */
  var x=(fi*2654435761>>>0)%1000/1000;
  return (x-.5)*.12;
}
function signal(){                            /* l'aiguille : guide muet, étroit */
  var d=Math.abs(F0()-FSTAR);
  var s=Math.max(0,1-d/150);
  return Math.min(1,Math.max(0,s+jit(FI)));
}
function showFreq(){
  freqEl.innerHTML=Math.round(F0())+"<small> Hz</small>";
  var s=signal(),ang=(-72+144*s)*Math.PI/180;
  var x2=46+36*Math.sin(ang),y2=50-36*Math.cos(ang);
  ndg.setAttribute("x2",x2.toFixed(1));ndg.setAttribute("y2",y2.toFixed(1));
  window.__sig=s;
}
function setFI(i){FI=Math.max(0,Math.min(99,i));dial.value=FI;showFreq();}
document.getElementById("minus").addEventListener("click",function(){setFI(FI-1);});
document.getElementById("plus").addEventListener("click",function(){setFI(FI+1);});
dial.addEventListener("input",function(){setFI(parseInt(dial.value,10));});

/* ---- statique déterministe par poste (mulberry32) ---- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;
  var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;
  return((t^t>>>14)>>>0)/4294967296;};}
function staticFor(fi){
  var r=mulberry32(fi*2654435761>>>0||1),rows=7*P.thick,out=[];
  for(var i=0;i<34;i++)out.push({c:r()*P.n_col,k:(r()*rows)|0,a:.22+r()*.5});
  return out;
}

/* ---- audio + tracé ---- */
var ac=null,master=null,band=null,wall0=0,mode=null,playing=false,fading=false,iv=0;
function buildAudio(){
  ac=new (window.AudioContext||window.webkitAudioContext)();
  master=ac.createGain();master.gain.value=.6;
  band=ac.createBiquadFilter();band.type="bandpass";
  band.frequency.value=F0();band.Q.value=1.1;
  master.connect(band);band.connect(ac.destination);
}
function tonesList(){
  var out=[],dt=P.col_ms/1000;
  for(var c=0;c<P.n_col;c++){
    for(var r=0;r<7;r++){
      if(GRID[c*7+r]==="1"){
        for(var k=0;k<P.thick;k++){
          out.push({f:P.f_base+((6-r)*P.thick+k)*P.f_step,c:c});
        }
      }
    }
  }
  return out;
}
function play(){
  if(playing)return;
  if(!ac)buildAudio();
  if(ac.state==="suspended")ac.resume();
  band.frequency.value=F0();
  mode=CORRECT()?"word":"noise";
  window.__mode=mode;
  var tones=mode==="word"?tonesList():[];
  var noise=mode==="noise"?staticFor(FI):[];
  var dt=P.col_ms/1000;
  var t0=ac.currentTime+.15;
  wall0=performance.now();
  var drone=ac.createOscillator(),dg=ac.createGain();
  drone.frequency.value=P.drone_f;dg.gain.value=P.drone_a*2.2;
  drone.connect(dg);dg.connect(master);
  var dur=mode==="word"?(P.lead+P.n_col*dt+1.3):3.0;
  drone.start(t0);drone.stop(t0+dur);
  /* faux poste : léger bruit blanc, passé dans le passe-bande accordé —
     la statique se règle elle-même comme sur un vrai poste */
  if(mode==="noise"){
    var nlen=2*ac.sampleRate,nb=ac.createBuffer(1,nlen,ac.sampleRate),
        nch=nb.getChannelData(0);
    for(var z=0;z<nlen;z++)nch[z]=Math.random()*2-1;
    var ns=ac.createBufferSource();ns.buffer=nb;ns.loop=true;
    var ng=ac.createGain();ng.gain.value=.07;
    ns.connect(ng);ng.connect(master);
    ns.start(t0);ns.stop(t0+dur);
    window.__noise=true;
  }
  for(var i=0;i<tones.length;i++){
    var o=ac.createOscillator(),g=ac.createGain(),tn=tones[i];
    o.frequency.value=tn.f;
    var a=t0+P.lead+tn.c*dt,b=a+dt;
    g.gain.setValueAtTime(0,a);
    g.gain.linearRampToValueAtTime(P.tone_a,a+.006);
    g.gain.setValueAtTime(P.tone_a,b-.006);
    g.gain.linearRampToValueAtTime(0,b);
    o.connect(g);g.connect(master);o.start(a);o.stop(b);
  }
  window.__sched=tones.length;
  playing=true;fading=false;
  msg.textContent=mode==="word"?"…":"STATIQUE.";
  clearInterval(iv);iv=setInterval(function(){draw(tones,noise,dt);},40);
}
document.getElementById("play").addEventListener("click",play);
var cv=document.getElementById("spec"),cx=cv.getContext("2d");
function draw(tones,noise,dt){
  if(!playing)return;
  var elapsed=(performance.now()-wall0)/1000;
  var W=cv.width,H=cv.height,rows=7*P.thick;
  var rowH=(H-18)/rows,colW=(W-28)/P.n_col;
  var total=mode==="word"?(P.lead+P.n_col*dt):2.2;
  var hold=mode==="word"?2.6:.5;
  cx.fillStyle="#080604";cx.fillRect(0,0,W,H);
  var colNow=mode==="word"?(elapsed-P.lead)/dt:elapsed/.09;
  function cell(c,k,a){
    var x=14+c*colW,y=9+k*rowH;
    cx.fillStyle="rgba(230,170,60,"+a+")";
    cx.fillRect(x,y,colW-2,rowH-1);
  }
  if(!fading){
    if(mode==="word"){
      var show=elapsed>total?P.n_col-1:colNow-1;
      for(var i=0;i<tones.length;i++){
        var tn=tones[i];
        if(tn.c>show)continue;
        cell(tn.c,(tn.f-P.f_base)/P.f_step,.92);
      }
    }else{
      for(var j=0;j<noise.length;j++){
        var d=noise[j];
        if(d.c>colNow)continue;
        cell(d.c,d.k,d.a);
      }
    }
  }
  if(elapsed>total+hold){
    /* le mot ne reste JAMAIS affiché : fondu, puis noir */
    fading=true;
    cx.fillStyle="rgba(8,6,4,.28)";cx.fillRect(0,0,W,H);
    if(elapsed>total+hold+1.3){
      playing=false;clearInterval(iv);
      cx.fillStyle="#080604";cx.fillRect(0,0,W,H);
      msg.textContent=mode==="word"?"LA BOBINE SE REPOSE.":"STATIQUE.";
    }
  }
}
showFreq();
</script>
</body>
</html>
