<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>.</title>
<style>
  html,body{height:100%;margin:0;background:#050403;overflow:hidden}
  body{font-family:Consolas,'Courier New',monospace;color:#d4af37}
  .scan{position:fixed;inset:0;pointer-events:none;z-index:9;
    background:repeating-linear-gradient(0deg,rgba(0,0,0,.22) 0 1px,transparent 1px 3px)}
  .vig{position:fixed;inset:0;pointer-events:none;z-index:8;
    background:radial-gradient(ellipse at 50% 45%,transparent 55%,rgba(0,0,0,.75) 100%)}
  #screen{position:absolute;inset:0;padding:6vh 8vw;box-sizing:border-box;
    display:flex;flex-direction:column;justify-content:flex-end}
  #out{white-space:pre-wrap;line-height:1.75;font-size:17px;letter-spacing:.06em;
    text-shadow:0 0 6px rgba(212,175,55,.35)}
  #out .dim{color:#8a7332}
  #out .runes{margin:10px 0 4px}
  #out .runes svg{width:34px;height:41px;margin-right:16px;
    filter:drop-shadow(0 0 5px rgba(212,175,55,.5))}
  #inline{display:none;font-size:17px;letter-spacing:.06em}
  #inline .pr{color:#8a7332;margin-right:10px}
  #ghost{position:absolute;left:-9999px}
  #caret{display:inline-block;width:11px;height:20px;background:#d4af37;
    vertical-align:text-bottom;animation:bl 1.05s steps(1) infinite}
  @keyframes bl{50%{opacity:0}}
  .fin{font-size:21px;letter-spacing:.28em;color:#f0d78c;text-align:center;margin:4vh 0}
  .finring{text-align:center;margin-top:3vh}
  .finring svg{width:58px;height:70px;margin:0 7px;filter:drop-shadow(0 0 9px rgba(212,175,55,.65))}
  .seal{margin:14px 0 6px;padding:10px 0;border-top:1px solid rgba(212,175,55,.22);
    border-bottom:1px solid rgba(212,175,55,.22);text-align:center}
  .seal .seal-step{font-size:11px;color:#8a7332;letter-spacing:.3em}
  .seal .seal-digits{font-size:52px;letter-spacing:.42em;color:#f0d78c;
    text-shadow:0 0 18px rgba(212,175,55,.55);margin:6px 0 4px;text-indent:.42em}
  .seal .seal-digits.big{font-size:60px}
  .seal .seal-say{font-size:11.5px;color:#d4af37;letter-spacing:.14em}
  .seal.closing{opacity:.25;transition:opacity .6s ease}
  .seal.closed{opacity:.55}
  .seal.closed .seal-digits{color:#8a7332;text-shadow:none}
  .merci{position:fixed;left:0;right:0;top:50%;transform:translateY(-50%);
    text-align:center;z-index:7;pointer-events:none;
    opacity:0;transition:opacity 2.8s ease}
  .merci.show{opacity:1}
  .merci .m1{font-size:24px;letter-spacing:.34em;color:#f0d78c;
    text-shadow:0 0 16px rgba(212,175,55,.6)}
  .merci .m2{font-size:14px;letter-spacing:.22em;color:#d4af37;margin-top:2.2vh}
  .merci .m3{font-size:11px;letter-spacing:.3em;color:#8a7332;margin-top:3vh}
</style>
</head>
<body>
<div class="scan"></div><div class="vig"></div>
<div id="screen"><div id="out"></div><div id="inline"><span class="pr">&gt;</span><span id="typed"></span><span id="caret"></span></div></div>
<input id="ghost" autocomplete="off" spellcheck="false">
<!-- Le Consortium sourit de vos efforts. -->
<script>
var K=0x5A;
function D(h){var s="";for(var i=0;i<h.length;i+=4){s+=String.fromCharCode(parseInt(h.substr(i,4),16)^K);}return s;}
var PAIRS=[["000e0008001300150017000a0012001f","001e001b001d000f"],
    ["000e00030008001b00140009","001f000d001b0000"],
    ["0015001700180008001f","0011001f0014001b"],
    ["00090013001d0014001f","0012001b001d001b"],
    ["001b00160016001f0016001f","00130009001b001b"],
    ["001900130014001f0017001b","001c001f0012000f"],
    ["001c000f0009001300150014","001c001f0012000f"],
    ["001f0017000a00130008001f","00080013001e0015"],
    ["00150014001e001f","001f000d001b0000"],
    ["001e001f001900120013001c001c0008001f",""]];
var CODES=[["000e0008001300150017000a0012001f","006d0069006a006b"],
    ["000e00030008001b00140009","006e00620068006c"],
    ["0015001700180008001f","0063006b006f006d"],
    ["00090013001d0014001f","0068006c006e0062"],
    ["001b00160016001f0016001f","006f006200690063"],
    ["001900130014001f0017001b","00620068006b006e"],
    ["001c000f0009001300150014","006b006e006c0068"],
    ["001f0017000a00130008001f","00690063006d006f"],
    ["00150014001e001f","006c006f00630062"],
    ["001e001f001900120013001c001c0008001f","00680062006e006a"]];
var ROMAN=["I", "II", "III", "IV", "V", "VI", "VII", "VIII", "IX", "X"];
var CONF={"DAGU":"LA PREMIÈRE PIERRE EST POSÉE.","EWAZ":"LE FIL S'ALLONGE.","KENA":"L'OMBRE A PARLÉ.","HAGA":"LE SIGNE A ÉTÉ VU.","ISAA":"LE VIVANT CONFIRME.","FEHU":"DOUBLE. COMME LA MAIN QUI DONNE.","RIDO":"LE TERRITOIRE S'OUVRE."};
var REF=["LE CONSORTIUM ATTEND.", "CECI N'EST PAS LA CLÉ.", "NON.", "LES RUNES RESTENT MUETTES.", "ENCORE."];
var RUN={"A":["M14 4 V44", "M14 10 L32 18", "M14 26 L32 34"],"B":["M14 4 V44", "M14 8 L30 15 L14 23", "M14 23 L30 30 L14 38"],"C":["M30 8 L13 24 L30 40"],"D":["M8 13 L23 24 L8 35", "M32 13 L17 24 L32 35"],"E":["M10 4 V44", "M30 4 V44", "M10 4 L20 24 L30 4"],"F":["M14 44 V4", "M14 10 L30 4", "M14 22 L30 14"],"G":["M8 12 L32 36", "M32 12 L8 36"],"H":["M20 4 V44", "M8 14 L32 34", "M32 14 L8 34"],"I":["M20 4 V44"],"J":["M11 32 A11 11 0 0 1 29 13", "M29 32 A11 11 0 0 1 11 13"],"K":["M14 4 V44", "M32 4 L14 24 L32 44"],"L":["M16 4 V44", "M16 30 L32 44"],"M":["M10 4 V44", "M30 4 V44", "M10 4 L30 22", "M30 4 L10 22"],"N":["M20 4 V44", "M9 15 L31 33"],"O":["M20 6 L32 24 L20 42 L8 24 Z"],"P":["M14 4 V44", "M14 14 A10 10 0 0 1 14 34"],"Q":["M20 4 V28", "M20 28 A8 8 0 1 0 20 44"],"R":["M14 4 V44", "M14 4 L28 12 L14 22", "M14 22 L30 44"],"S":["M24 4 L14 20 L26 26 L16 44"],"T":["M20 44 V12", "M8 4 L20 16 L32 4"],"U":["M10 40 V16 Q10 6 20 6", "M20 6 Q30 6 30 16 V40"],"V":["M16 4 V44", "M16 8 L32 14 L16 20"],"W":["M24 4 V44", "M24 8 L8 14 L24 20"],"X":["M20 4 V44", "M8 24 H32"],"Y":["M20 44 V18", "M20 18 L8 32", "M20 18 L32 32"],"Z":["M20 44 V18", "M20 18 L8 4", "M20 18 L32 4"]};
var seen=0, ri=0, ei=0;
var RAIN={on:false,raf:0,cols:[],W:0,H:0};
var GLYPHS=['A','U','T','G','C'].concat(
  ['\u16a0','\u16a2','\u16a8','\u16b1','\u16aa','\u16c1','\u16a5','\u16b3','\u16a6','\u16d6','\u16a7','\u16a9']);
function rainStart(){
  if(RAIN.on)return;RAIN.on=true;
  var cv=document.createElement('canvas');cv.id='goldrain';cv.style.cssText=
    'position:fixed;inset:0;z-index:5;pointer-events:none';
  document.body.appendChild(cv);
  var cx=cv.getContext('2d');
  function fit(){RAIN.W=cv.width=innerWidth;RAIN.H=cv.height=innerHeight;
    var n=Math.max(14,Math.floor(RAIN.W/95));
    while(RAIN.cols.length<n)RAIN.cols.push({y:Math.random()*-RAIN.H,v:0.45+Math.random()*1.15,
      step:0,swap:40+Math.floor(Math.random()*80),g:GLYPHS[(Math.random()*GLYPHS.length)|0]});
    RAIN.cols.length=n;}
  fit();addEventListener('resize',fit);
  function tick(){
    cx.fillStyle='rgba(5,4,3,.24)';cx.fillRect(0,0,RAIN.W,RAIN.H);
    cx.textAlign='center';cx.font='34px Consolas,monospace';
    for(var i=0;i<RAIN.cols.length;i++){
      var c=RAIN.cols[i];c.y+=c.v*9;c.step++;
      if(c.step>c.swap){c.step=0;c.g=GLYPHS[Math.floor(Math.random()*GLYPHS.length)];}
      var lead=RAIN.H-c.y;
      if(lead>-60&&lead<RAIN.H+60){
        var x=(i+.5)*RAIN.W/RAIN.cols.length;
        cx.fillStyle='#f0d78c';cx.shadowColor='rgba(212,175,55,.8)';cx.shadowBlur=14;
        cx.fillText(c.g,x,c.y);
        var y2=c.y-44;
        if(y2>-60){cx.fillStyle='rgba(212,165,45,.55)';cx.shadowBlur=0;
          cx.fillText(c.g,x,y2);}
        cx.shadowBlur=0;
      }
      if(c.y>RAIN.H+90)c.y=Math.random()*-400;
    }
    RAIN.raf=requestAnimationFrame(tick);
  }
  tick();
}
function merci(){
  if(document.querySelector('.merci'))return;
  var d=document.createElement('div');d.className='merci';
  var l1=document.createElement('div');l1.className='m1';l1.textContent='LE CONSORTIUM VOUS REMERCIE';
  var l2=document.createElement('div');l2.className='m2';l2.textContent='CE QUI EST DÉCHIFFRÉ N\'EST JAMAIS OUBLIÉ';
  var l3=document.createElement('div');l3.className='m3';l3.textContent='— MNÉMOSYNE · MMXXVI —';
  d.appendChild(l1);d.appendChild(l2);d.appendChild(l3);
  document.body.appendChild(d);
  setTimeout(function(){d.classList.add('show');},80);
}
var EARLY=["LE DERNIER FILM N'A PAS ENCORE ÉTÉ TROUVÉ.", "LA BOBINE FINALE MANQUE À L'APPEL.", "REVENEZ AVEC TOUT. OU RIEN."];
function codeOf(w){for(var i=0;i<CODES.length;i++){if(D(CODES[i][0])===w)return D(CODES[i][1]);}return null;}
function romanOf(w){for(var i=0;i<CODES.length;i++){if(D(CODES[i][0])===w)return ROMAN[i];}return "";}
function runeRow(word){
  var d=document.createElement("div");d.className="runes";
  for(var i=0;i<word.length;i++){
    var L=word[i],paths=RUN[L];if(!paths)continue;
    var ns="http://www.w3.org/2000/svg";
    var sv=document.createElementNS(ns,"svg");sv.setAttribute("viewBox","0 0 40 48");
    for(var j=0;j<paths.length;j++){
      var p=document.createElementNS(ns,"path");
      p.setAttribute("d",paths[j]);p.setAttribute("fill","none");
      p.setAttribute("stroke","#d4af37");p.setAttribute("stroke-width","3.4");
      p.setAttribute("stroke-linecap","round");sv.appendChild(p);
    }
    d.appendChild(sv);
  }
  return d;
}
function line(t,cls){var s=document.createElement("div");if(cls)s.className=cls;
  s.textContent=t;out.appendChild(s);scr.scrollTop=1e9;}
var out=document.getElementById("out"),scr=document.getElementById("screen"),
    inl=document.getElementById("inline"),typed=document.getElementById("typed"),
    ghost=document.getElementById("ghost");
function wake(){
  inl.style.display="block";
  ghost.focus();
}
document.addEventListener("click",wake);
ghost.addEventListener("input",function(){typed.textContent=ghost.value.toUpperCase();});
ghost.addEventListener("keydown",function(e){
  if(e.key!=="Enter")return;
  var raw=ghost.value;ghost.value="";typed.textContent="";
  line("> "+raw.toUpperCase(),"dim");
  var word_norm=raw.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toUpperCase().trim();
  var hit=null;
  for(var i=0;i<PAIRS.length;i++){
    if(D(PAIRS[i][0])===word_norm){hit=D(PAIRS[i][1]);break;}
  }
  if(hit===null){line(REF[ri++%REF.length]);return;}
  if(hit==="")
  {
    if(seen<9){line(EARLY[ei++%EARLY.length],"dim");return;}
    finale();return;
  }
  line(CONF[hit]||"LA CLÉ EST JUSTE.");
  out.appendChild(runeRow(hit));
  seal(word_norm, hit);
  seen++;
  if(seen===1){line("· · ·","dim");}
});
function seal(w, hit){
  var sealBox=document.createElement("div");sealBox.className="seal";
  var st=document.createElement("div");st.className="seal-step";
  st.textContent="SCEAU "+romanOf(w);
  var dg=document.createElement("div");dg.className="seal-digits";
  dg.textContent=codeOf(w);
  var sy=document.createElement("div");sy.className="seal-say";
  sy.textContent="COMMUNIQUEZ CE CODE AU GARDIEN — LA CIRE NE DURERA PAS.";
  sealBox.appendChild(st);sealBox.appendChild(dg);sealBox.appendChild(sy);
  out.appendChild(sealBox);scr.scrollTop=1e9;
  setTimeout(function(){
    sealBox.classList.add("closing");
    setTimeout(function(){
      sealBox.classList.add("closed");
      dg.textContent="· · · ·";
      sealBox.classList.remove("closing");
      line("LA CIRE S'EST REFERMÉE.","dim");
    },650);
  },10000);
}
function finale(){
  var f=document.createElement("div");f.className="fin";f.textContent="VOUS AVEZ DÉCHIFFRÉ LE CODE. LE SAVOIR EST LA CLÉ.";
  out.appendChild(f);
  var ring=document.createElement("div");ring.className="finring";
  var w="DECHIFFRE";
  for(var i=0;i<w.length;i++){
    var L=w[i],paths=RUN[L];if(!paths)continue;
    var ns="http://www.w3.org/2000/svg";
    var sv=document.createElementNS(ns,"svg");sv.setAttribute("viewBox","0 0 40 48");
    for(var j=0;j<paths.length;j++){
      var p=document.createElementNS(ns,"path");
      p.setAttribute("d",paths[j]);p.setAttribute("fill","none");
      p.setAttribute("stroke","#f0d78c");p.setAttribute("stroke-width","3.4");
      p.setAttribute("stroke-linecap","round");sv.appendChild(p);
    }
    ring.appendChild(sv);
  }
  out.appendChild(ring);
  inl.style.display="none";
  var dg=document.createElement("div");dg.className="seal-digits big";
  dg.textContent=codeOf("DECHIFFRE");
  var lbl=document.createElement("div");lbl.className="seal-step";
  lbl.textContent="DERNIER SCEAU — POUR LE GARDIEN";
  out.appendChild(lbl);out.appendChild(dg);
  setTimeout(rainStart,1400);
  setTimeout(merci,21000);
}
setTimeout(wake,350);
</script>
</body>
</html>
